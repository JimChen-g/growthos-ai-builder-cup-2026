name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.11; 3.14 alone hid an import crash on 3.11-3.13.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m demo.run_phase1 --mode demo
      - run: uv run python -m demo.run_phase31 --mode demo
      - run: uv run python -m demo.run_phase5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Synthetic public config for build validation only; CI never deploys this artifact.
          # No production Firebase project or business credential is used by this job.
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder-not-a-real-api-key"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "growthos-ci.invalid"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "growthos-ci-fixture"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:ci-fixture"
      - name: Synthetic build must be blocked from Hosting deployment
        run: |
          if node ../scripts/verify-hosting-build.cjs growthos-ci-fixture; then
            echo "Unsafe CI artifact unexpectedly passed the deployment guard" >&2
            exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix blockchain ci
      - run: npm --prefix blockchain run contract:check
