[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-growth-agent"
version = "0.5.0"
description = "Approval-gated AI growth orchestration for founders"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<60",
  "fastapi>=0.116,<1",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.2.8,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["agents*", "backend*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# "A" catches builtin shadowing such as a `list` method breaking later `list[...]`
# annotations on Python 3.11-3.13 (3.14 defers annotation evaluation and hides it).
select = ["E", "F", "I", "UP", "B", "A"]
